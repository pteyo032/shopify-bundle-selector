# This repo is a fragment of the Horizon theme (two theme blocks), not a full
# theme. Every check below was individually verified against the real Horizon
# theme / this repo's own render calls before being disabled here — none are
# code defects:
#
# - MissingTemplate: references Horizon-native snippets (typography-style,
#   spacing-style) that a real theme provides — not shipped here on purpose.
# - TranslationKeyExists: bundle-tier.liquid and bundle-selector.liquid reuse
#   Horizon-native locale keys (products.product.sold_out/add_to_cart/
#   unavailable, actions.added) that a real Horizon theme's en.default.json
#   already provides. Redefining them here would risk drifting from the
#   theme's own copy.
# - OrphanedSnippet: bundle-selector-styles.liquid and
#   bundle-tier-code-warnings.liquid ARE rendered (blocks/bundle-selector.liquid
#   lines 11 and 80) — theme-check's dependency graph doesn't trace {% render %}
#   calls made from inside a theme block (blocks/*.liquid) the way it does
#   from sections, so it reports them as unused when they aren't.
# - ValidScopedCSSClass: bundle-tier.liquid's CSS classes are defined in
#   bundle-selector-styles.liquid, rendered once by its parent block
#   (bundle-selector.liquid). Per this check's own docs, a class defined in an
#   ancestor-rendered snippet is in scope — but the ancestor relationship here
#   is a theme-block schema relationship (block type declared in
#   bundle-selector's settings), not an explicit {% render %} from parent to
#   child, which this check also doesn't trace. Same root cause as
#   OrphanedSnippet above. Worth a live visual check in the theme editor at
#   some point, not blocking on it here.
extends: theme-check:recommended

TranslationKeyExists:
  enabled: false

OrphanedSnippet:
  enabled: false

ValidScopedCSSClass:
  enabled: false

MissingTemplate:
  enabled: false
